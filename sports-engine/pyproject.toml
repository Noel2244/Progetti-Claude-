[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-engine"
version = "0.1.0"
description = "Personal sports analytics & betting research engine (research / paper mode only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - private personal use" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]
analytics = ["duckdb>=0.10", "pyarrow>=14"]
dev = ["pytest>=8", "hypothesis>=6.100", "httpx>=0.27"]

[project.scripts]
sports-engine = "sports_engine.cli:main"

[tool.setuptools.packages.find]
include = ["sports_engine*"]

[tool.setuptools.package-data]
sports_engine = [
    "database/*.sql",
    "entity/registry/*.yaml",
    "api/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires outbound network access (deselected by default)",
    "slow: slow tests",
]
addopts = "-m 'not network'"
