# Curated canonical Italian clubs. Aliases are matched case-insensitively and
# apply to every source. Club *lineages* (re-foundations, historical names) are
# deliberately mapped to one entity - documented in docs/DATA_MODEL.md.
# An alias may belong to exactly one team (collisions fail loudly at load time).
